# 記事ごとのシェア画像（OGP）をプルリクで自動で作り、そのプルリクに足す（M-013）。
# 新しい記事を足したり見出しを変えたりしたプルリクで、画像と front matter の image: を作り直してコミットする。
# 同じリポジトリのブランチからのプルリクだけで動く（フォークからは動かない）。シークレットは使わない。
name: og-images
on:
  pull_request:
    paths:
      - "storage/**"
      - "shopping/**"
      - "stock/**"
      - "scripts/make_og.py"
permissions:
  contents: write
concurrency:
  group: og-images-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==12.0.0
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - run: python scripts/make_og.py
      - name: 変わっていればコミットする
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/images/og storage shopping stock
            git commit -m "シェア画像を作り直す（scripts/make_og.py）"
            git push
          else
            echo "変更なし"
          fi
