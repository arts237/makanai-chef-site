# main に入った公開ページの追加・更新を IndexNow（Bing など）へ知らせる（M-006）。
# Cloudflare の本番ビルドを待ってから送る（scripts/indexnow.py）。シークレットは使わない（キーは公開ファイル）。
name: indexnow
on:
  push:
    branches: [main]
permissions:
  contents: read
# concurrency は付けない（同じグループだと、待っている回が新しい回に置き換えられ、続けてマージしたときに途中のページが送られない）
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: 変わったページを IndexNow へ送る
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python scripts/indexnow.py
