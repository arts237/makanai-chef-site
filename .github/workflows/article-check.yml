# 記事の機械検査（鍵なし）。プルリクごとと main へのpushで動く。
# ここではシークレットを一切使わない。外部のアクションはコミットSHAで固定する。
# scripts/・.github/・_includes/・_layouts/ を変えるプルリクは、人が必ず中身を見てからマージする。
name: article-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: article-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 pillow==12.0.0
      - name: シェア画像（プルリクでは作る、mainでは作り忘れがないか見る）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
            python scripts/make_og.py
            if [ -n "$(git status --porcelain -- assets/images/og)" ] || ! git diff --quiet; then
              echo "::warning::シェア画像がまだコミットされていません。og-images ワークフローのコミットを待ってからマージしてください（フォークからのプルリクは手元で python scripts/make_og.py）"
            fi
          else
            python scripts/make_og.py --check
          fi
      - name: 記事の検査（必須項目・数値の直書き・禁止語・Amazonのリンク・重なり）
        run: python scripts/check_articles.py
      - uses: ruby/setup-ruby@4dc28cf14d77b0afa6832d9765ac422dbf0dfedd # v1.298.0
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
      - name: ビルドが通るか
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: bundle exec jekyll build --destination "$RUNNER_TEMP/site"
      - name: ビルド後のページに「データなし」が無いか
        run: |
          if grep -rl "【データなし" "$RUNNER_TEMP/site"; then
            echo "::error::facts.yml にない値を参照しているページがある"; exit 1
          fi
      - name: フィード（/feed.xml）が正しいXMLで、保存方法の記事だけを含むか
        run: |
          python - "$RUNNER_TEMP/site/feed.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {"a": "http://www.w3.org/2005/Atom"}
          root = ET.parse(sys.argv[1]).getroot()
          links = [e.find("a:link", ns).get("href") for e in root.findall("a:entry", ns)]
          bad = [u for u in links if "/storage/" not in u or u.endswith("/storage/")]
          if not links or bad:
              print(f"::error::feed.xml の記事が0件、または記事以外を含む: {bad}"); sys.exit(1)
          print(f"feed.xml: {len(links)}件")
          PY
      - name: よくある質問（/faq/）の構造化データが正しいJSONで、質問が全部入っているか
        run: |
          python - "$RUNNER_TEMP/site/faq/index.html" _data/faq.yml <<'PY'
          import json, re, sys, yaml
          html = open(sys.argv[1], encoding="utf-8").read()
          blocks = [json.loads(x) for x in re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)]
          data = next((b for b in blocks if b.get("@type") == "FAQPage"), {})
          n = sum(len(g["items"]) for g in yaml.safe_load(open(sys.argv[2], encoding="utf-8")))
          got = len(data.get("mainEntity", []))
          if data.get("@type") != "FAQPage" or got != n or any("<" in q["acceptedAnswer"]["text"] for q in data.get("mainEntity", [])):
              print(f"::error::faq の構造化データが不正（質問 {got}/{n}）"); sys.exit(1)
          print(f"faq: {got}問")
          PY
      - name: 記事ページのシェア画像（og:image）が記事ごとの画像で、ファイルがあるか
        run: |
          python - "$RUNNER_TEMP/site" <<'PY'
          import os, re, sys
          site = sys.argv[1]; bad = []; n = 0
          for d, _, fs in os.walk(site):
              for fn in fs:
                  if not fn.endswith(".html"):
                      continue
                  html = open(os.path.join(d, fn), encoding="utf-8").read()
                  if 'class="a-article' not in html:
                      continue
                  n += 1
                  m = re.search(r'<meta property="og:image" content="https?://[^/]+(/[^"]+)"', html)
                  if not m or not m.group(1).startswith("/assets/images/og/") or not os.path.exists(site + m.group(1)):
                      bad.append(os.path.relpath(os.path.join(d, fn), site))
          if not n or bad:
              print(f"::error::記事ごとのシェア画像になっていないページ: {bad}"); sys.exit(1)
          print(f"シェア画像: {n}ページ")
          PY
