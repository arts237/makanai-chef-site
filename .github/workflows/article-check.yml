# 記事の機械検査（鍵なし）。プルリクごとと main へのpushで動く。
# ここではシークレットを一切使わない。外部のアクションはコミットSHAで固定する。
# scripts/・.github/・_includes/・_layouts/ を変えるプルリクは、人が必ず中身を見てからマージする。
name: article-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: article-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: 記事の検査（必須項目・数値の直書き・禁止語・Amazonのリンク・重なり）
        run: python scripts/check_articles.py
      - uses: ruby/setup-ruby@4dc28cf14d77b0afa6832d9765ac422dbf0dfedd # v1.298.0
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
      - name: ビルドが通るか
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: bundle exec jekyll build --destination "$RUNNER_TEMP/site"
      - name: ビルド後のページに「データなし」が無いか
        run: |
          if grep -rl "【データなし" "$RUNNER_TEMP/site"; then
            echo "::error::facts.yml にない値を参照しているページがある"; exit 1
          fi
      - name: フィード（/feed.xml）が正しいXMLで、保存方法の記事だけを含むか
        run: |
          python - "$RUNNER_TEMP/site/feed.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {"a": "http://www.w3.org/2005/Atom"}
          root = ET.parse(sys.argv[1]).getroot()
          links = [e.find("a:link", ns).get("href") for e in root.findall("a:entry", ns)]
          bad = [u for u in links if "/storage/" not in u or u.endswith("/storage/")]
          if not links or bad:
              print(f"::error::feed.xml の記事が0件、または記事以外を含む: {bad}"); sys.exit(1)
          print(f"feed.xml: {len(links)}件")
          PY
