# 一時的な検証用（移行ブランチ専用。mainに入れる前に削除する）
# 今のmain（公開中のGitHub Pagesと同じ中身）と、このブランチ（新ドメイン向け）をそれぞれビルドし、
# URLの違いだけを正規化して比べる。結果は注釈（annotation）に出す。鍵は使わない。
name: compare-build
on:
  push:
    branches: [migrate-cloudflare]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _main
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
      - name: Build (new domain)
        run: bundle exec jekyll build -d "$RUNNER_TEMP/out/new"
      - name: Build (current main)
        run: bundle exec jekyll build -s _main -d "$RUNNER_TEMP/out/old"
      - name: Old URLs that remain in the new build
        run: |
          if grep -rn "arts237.github.io\|makanai-chef-site" "$RUNNER_TEMP/out/new" > left.txt; then
            msg=$(head -c 6000 left.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=旧URLの残り::${msg}"
          else echo "::notice title=旧URLの残り::なし"; fi
      - name: Compare
        run: |
          norm() {
            find "$1" -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.json' -o -name '*.css' -o -name '*.js' \) -print0 | while IFS= read -r -d '' f; do
              sed -i -E \
                -e 's#https://arts237\.github\.io/makanai-chef-site#https://makanai-chef.com#g' \
                -e 's#https://arts237\.github\.io#https://makanai-chef.com#g' \
                -e 's#/makanai-chef-site/#/#g' \
                -e 's#"/makanai-chef-site"#""#g' \
                -e 's#\?v=[0-9]+#?v=X#g' \
                -e 's#"(dateModified|datePublished)":"[^"]*"#"\1":"X"#g' \
                -e 's#<lastmod>[^<]*</lastmod>#<lastmod>X</lastmod>#g' "$f"
            done
          }
          norm "$RUNNER_TEMP/out/old"; norm "$RUNNER_TEMP/out/new"
          n_old=$(find "$RUNNER_TEMP/out/old" -type f | wc -l); n_new=$(find "$RUNNER_TEMP/out/new" -type f | wc -l)
          if diff -r "$RUNNER_TEMP/out/old" "$RUNNER_TEMP/out/new" > diff.txt; then
            echo "::notice title=比較::差分なし（旧${n_old}ファイル・新${n_new}ファイル）"
          else
            msg=$(head -c 8000 diff.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=差分あり（旧${n_old}・新${n_new}ファイル）::${msg}"
            exit 1
          fi
