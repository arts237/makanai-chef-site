description: "賞味期限が近づいたらDiscord Botがお知らせ。そのまま使い切りレシピにたどり着けます。"
url: "https://makanai-chef.com"
baseurl: ""
lang: ja
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
markdown: kramdown
permalink: /:title/
# Amazonアソシエイトのトラッキングタグ（例: xxxxx-22）。記事内のAmazonリンクに自動で付与される
# Googleアナリティクス（GA4）の測定ID。_includes/analytics.html で使う
ga_id: "G-9M6RQ0PQZ6"
