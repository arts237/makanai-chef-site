# ビルドに含めないファイル（Jekyllの既定の除外に、Cloudflareの設定ファイルを足したもの）
exclude:
  - wrangler.jsonc
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
