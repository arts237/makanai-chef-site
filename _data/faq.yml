# よくある質問（/faq/）の正本。ページの本文と構造化データ（FAQPage）の両方をここから出す（M-010）。
# a はHTML（リンク・強調のみ）。機能・回数・料金を変えたら、ここも直す。
- group: まかないシェフについて
  items:
  - id: what
    q: まかないシェフって何？
    a: >-
      食材の賞味期限を覚えておいて、期限の前日と当日の朝に、DiscordのDMでお知らせしてくれるBotです。
      お知らせのボタンから、その食材を使い切るレシピを提案してもらえます。
      期限を覚えておくのは、シェフの仕事です。
  - id: no-server
    q: Discordのサーバーを持っていなくても使える？
    a: >-
      使えます。まかないシェフは、サーバーではなく「自分のDiscordアカウント」に追加できます。
      追加すると、まかないシェフとのDMで、自分だけのリストとして使えます。
      手順は<a href="/start/">始め方</a>をどうぞ。
  - id: server
    q: 自分のサーバーに入れて、みんなで使える？
    a: >-
      使えます。サーバーの管理権限がある人が追加すると、そのサーバーのメンバーも使えます。
      登録とお知らせは一人ずつ別々で、ほかの人の登録は見えません。
      DMが届くように、サーバーのプライバシー設定で「サーバーにいるメンバーからのダイレクトメッセージを許可する」をオンにしておいてください。
      手順は<a href="/start/#server">始め方の「サーバーに追加する方法」</a>にあります。
- group: 登録のしかた
  items:
  - id: register
    q: 食材はどうやって登録する？
    a: >-
      いちばん手軽なのは、買い物のレシートを撮るか、ネットスーパー・通販の注文履歴の画面をスクショして、まかないシェフとのDMに送ることです。
      読み取った食材と期限の目安が一覧で届くので、いらないものを外して登録します。
      1つずつなら、DMの「➕ 食材を追加」ボタンか、<code>牛乳 明日</code>・<code>卵 10/25、豆腐 3日後</code>のように文章で送っても登録できます。
  - id: photo-care
    q: 写真を送るとき、気をつけることは？
    a: >-
      名前・住所・電話番号・注文番号・カード番号・店名など、読み取りに要らない部分は隠してから送ってください（注文履歴の画面には住所や名前が写りやすいです）。
      隠さずに送った写真も、そのまま読み取りのAI（Anthropic社・米国）に送られます。まかないシェフは写真を保存しません。
      1回に読むのは1枚目だけなので、何枚かあるときは1枚ずつ送ってください。
  - id: accuracy
    q: 登録される期限は正確？
    a: >-
      写真から付く期限は、買った日（注文履歴ならお届け日、無ければ注文日）から、食材ごとのだいたいの日数で付けた<strong>目安</strong>です。
      パッケージに書かれた期限の印字は読みません。表示の期限とはずれることがあるので、食べる前はパッケージの表示と食材の状態を確かめてください。
      正しい期限がわかっているときは、手で登録するか、あとから期限を変更してください。
  - id: change
    q: 登録した期限を変えたい
    a: >-
      まかないシェフとのDMに、<code>豆腐 10/30に変更</code>のように送ってください。
      <code>豆腐5日後に変更、バナナ明日に変更</code>のように、いくつかの食材をそれぞれ別の日付にまとめて変えることもできます。確認の画面が出てから変わります。
      「📋 リスト」の画面から、期限を変える食材を選ぶこともできます。
  - id: frozen
    q: 冷凍したものも登録できる？
    a: >-
      できます。<code>豚肉 冷凍</code>のように送るか、登録のときに「❄️ 冷凍で登録」を押すと、冷凍の目安の日付で登録されます。
      冷凍の日付は、新鮮なうちに家で冷凍した場合の一般的な目安で、その日まで安全という意味ではありません。パックに書かれた期限が変わるわけでもありません。
      冷凍の目安がまだ無い食材は、リクエストのボタンから運営者に知らせることができます。
  - id: quantity
    q: 個数も登録できる？
    a: >-
      できます。<code>卵 6個 11/5</code>のように書くと個数つきで登録され、<code>卵 2個使った</code>と送ると残りが減ります。0になるとリストから外れます。
      個数を書かなければ、今までどおり個数なしで登録されます。
- group: お知らせ
  items:
  - id: when
    q: お知らせはいつ届く？
    a: >-
      期限が今日か明日の食材があるときに、その日の朝8時（日本時間）にDMで届きます。対象の食材が無い日は届きません。
      8時を過ぎてから登録した食材は、次の朝のお知らせからになります。
  - id: no-dm
    q: お知らせのDMが来ない
    a: >-
      まず「📋 リスト」で登録できているか見てください。次に、まかないシェフをブロックしていないか、メッセージリクエストに入っていないかを確かめてください。
      サーバーに追加して使っている場合は、サーバーのプライバシー設定でメンバーからのDMが許可されているかも見てください。
      Discordの障害やDMの設定によって、お知らせが届かないこともあります。それでも届かないときは<a href="https://discord.gg/RdXtGzzHN" target="_blank" rel="noopener">サポートサーバー</a>で教えてください。
  - id: expired
    q: 期限が切れた食材はどうなる？
    a: >-
      期限の翌日に一度お知らせが届き、そのあとはリストに「⚠️期限切れ」として残ります。自動では消えません。
      いらなくなったら、お知らせの「リストから外す」か「📋 リスト」から外してください。
      期限が切れたものを食べられるかどうかは、パッケージの表示と食材の状態を見て判断してください。
  - id: used
    q: 使い切ったらどうする？
    a: >-
      お知らせの「○○ 使い切った」を押すか、<code>牛乳 使い切った</code>と送ると、確認のあとリストから外れます。
      次に買うとよさそうな食材も出るので、そのままボタンで登録できます。
- group: レシピ
  items:
  - id: recipe
    q: レシピはどうやって出してもらう？
    a: >-
      お知らせの「使い切るレシピを提案してもらう」を押すと、期限が近い食材を使うレシピをAIが出します。
      お知らせを待たずに見たいときは、DMに<code>レシピ</code>と送るとボタンが出ます。
  - id: fridge
    q: 冷蔵庫の中を撮って送るとどうなる？
    a: >-
      読み取った食材の一覧が出ます。違うものは外し、足りないものは足してから「この食材でレシピを見る」を押すと、AIがレシピを出します。
      冷蔵庫の写真では、食材は登録されません。
      写真を送ると写真の読み取りを1回、「この食材でレシピを見る」を押すとAIの提案を1回使います。
  - id: recipe-accuracy
    q: AIのレシピは正確？
    a: >-
      AIのレシピは誤りを含むことがあります。アレルギーや加熱の具合は、ご自身で確かめてください。
- group: 料金
  items:
  - id: free
    q: 無料でどこまで使える？
    a: >-
      期限の登録（件数の制限なし）・お知らせ・内蔵レシピ検索は無料です。
      AIを使う提案（お知らせのボタンからのレシピ、冷蔵庫の写真からのレシピ、<code>/recipe</code>のAI、<code>/shopping</code>）は、合わせて1日2回まで無料です。日付が変わる（日本時間）とまた使えます。
      写真の読み取り（レシート・注文履歴・冷蔵庫）は、月5回まで無料です。超えたら、手で登録すれば使い続けられます。
  - id: premium
    q: プレミアムプランは？
    a: >-
      月額480円（税込）で、AIの提案と写真の読み取りを使える回数が増えます（上限あり）。
      申し込みは<code>/upgrade</code>、解約や支払い方法の変更は<code>/manage</code>からいつでもできます。毎月自動で更新され、解約すると次の請求日から課金が止まり、無料プランに戻ります。日割りの返金はありません。
      くわしくは<a href="/legal/#terms">利用規約</a>と<a href="/legal/#tokushoho">特定商取引法に基づく表記</a>をご覧ください。
- group: データとやめ方
  items:
  - id: data
    q: どんな情報を保存する？外部に送られる？
    a: >-
      保存するのは、登録した食材名と期限、DiscordユーザーID、プラン、利用回数などです。DMに送った文章そのものは保存しません。写真も保存しません。
      写真の読み取りとAIのレシピにはAnthropic社（米国）、決済にはStripe社、サーバーにはRailway社のサービスを使っており、必要な範囲で情報が送られます。
      くわしくは<a href="/legal/#privacy">プライバシーポリシー</a>をご覧ください。
  - id: quit
    q: やめたい・データを消したい
    a: >-
      外す前に、プレミアムの人は<code>/manage</code>で解約し、「📋 リスト」から登録を外しておいてください。外しただけでは、登録やプランは消えません。
      そのあと、Discordの「設定 → 認証済みアプリ」から外します（サーバーに入れた場合は、サーバー設定の「連携サービス」から）。
      外したあとでも、解約やデータの削除は<a href="mailto:info@opera-ai.jp">info@opera-ai.jp</a>へのメールで頼めます。手続きは<a href="/legal/#privacy">プライバシーポリシー</a>の7をご覧ください。
  - id: contact
    q: 困ったとき・要望があるときは？
    a: >-
      <a href="https://discord.gg/RdXtGzzHN" target="_blank" rel="noopener">サポートサーバー</a>の「#🐛不具合報告」「#💡要望・アイデア」か、<a href="/contact/">お問い合わせ</a>のメールからどうぞ。
