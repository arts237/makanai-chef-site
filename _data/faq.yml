# よくある質問（/faq/）の正本。ページの本文と構造化データ（FAQPage）の両方をここから出す（M-010・2026-11-05）。
# a はHTML（リンク・強調・箇条書きのみ）。構造化データではタグを外した文が単独で出るので、注意書きは各回答の中に書く。
# 同じ内容が始め方ページ（/start/ の手順3・お知らせが届いたら・知っておいてほしいこと）にもある。機能・回数・料金を変えたら両方を直す。
# T-033（内蔵レシピの廃止）を公開するときは、free・commands の「内蔵レシピ」を直す。
- group: 使う前に
  slug: before
  items:
  - id: what
    q: まかないシェフって何？
    a: >-
      食材の賞味期限を覚えておいて、期限の前日と当日の朝8時（日本時間）に、DiscordのDMでお知らせしてくれるBotです。
      登録は、レシートやネットの注文履歴の画面をDMに送れば、食材と期限の目安が一覧で届くので、選ぶだけです。
      お知らせのボタンから、その食材を使い切るレシピを提案してもらえます。
  - id: no-server
    q: Discordのサーバーを持っていなくても使える？
    a: >-
      使えます。まかないシェフは、サーバーではなく「自分のDiscordアカウント」に追加できます。
      追加すると、まかないシェフとのDMで、自分だけのリストとして使えます。
      手順は<a href="/start/">始め方</a>をどうぞ。
  - id: server
    q: 自分のサーバーに入れて、みんなで使える？
    a: >-
      使えます。サーバーの管理権限がある人が追加すると、そのサーバーのメンバーも使えます。
      登録とお知らせは一人ずつ別々で、ほかの人の登録の一覧は見えません。
      ただし、チャンネルで<code>/recipe</code>に食材を入れて使うと、入力した食材名と結果はその場にいる人にも見えます。
      DMが届くように、サーバーのプライバシー設定で「サーバーにいるメンバーからのダイレクトメッセージを許可する」をオンにしておいてください。
      手順は<a href="/start/#server">始め方の「サーバーに追加する方法」</a>にあります。
  - id: share
    q: 家族やルームメイトと同じリストを使える？
    a: >-
      今はできません。登録とお知らせは一人ずつ別々です。
  - id: free
    q: 無料でどこまで使える？
    a: >-
      <ul>
      <li>無料で、回数の制限なし：期限の登録（件数の制限もなし）、お知らせ、内蔵レシピ検索、DMに文章で送る操作</li>
      <li>1日2回まで無料：AIを使う提案（お知らせのボタンからのレシピ、冷蔵庫の写真からのレシピ、<code>/recipe</code>のAI、<code>/shopping</code>）。日付が変わる（日本時間）とまた使えます</li>
      <li>月5回まで無料：写真の読み取り（レシート・注文履歴・冷蔵庫）。翌月にまた使えます。超えても、手で登録すれば使い続けられます</li>
      </ul>
      回数を増やしたい人向けに、有料のプレミアムプランもあります。
- group: 使い始めて困ったら
  slug: trouble
  items:
  - id: no-welcome
    q: 追加したのに、DMが見当たらない
    a: >-
      追加すると、まかないシェフから使い方のDMが届きます（少し時間がかかることがあります）。DM一覧に無ければ「メッセージリクエスト」も見てください。
      それでも無ければ、<a href="https://discord.com/users/1546140293248716831" target="_blank" rel="noopener">まかないシェフのプロフィール</a>を開いて「メッセージを送る」を押し、<code>使い方</code>と送ってください。操作のボタンが出ます。
  - id: no-dm
    q: お知らせのDMが来ない
    a: >-
      まず「📋 リスト」で登録できているか見てください。次に、まかないシェフをブロックしていないか、メッセージリクエストに入っていないかを確かめてください。
      サーバーに追加して使っている場合は、サーバーのプライバシー設定でメンバーからのDMが許可されているかも見てください。
      Discordの障害やDMの設定によって、お知らせが届かないこともあります。それでも届かないときは<a href="https://discord.gg/RdXtGzzHN" target="_blank" rel="noopener">サポートサーバー</a>で教えてください。
  - id: commands
    q: コマンド（/expiry など）も使える？
    a: >-
      使えます（<code>/expiry</code> <code>/recipe</code> <code>/scan</code> <code>/shopping</code>）。ただ、まかないシェフとのDMにボタンや文章で送るほうが手軽です。
      サーバーのチャンネルでは文章を読まないので、チャンネルで登録するときは<code>/expiry add</code>を使ってください（返事は本人にだけ見えます）。
  - id: contact
    q: 困ったとき・要望があるときは？
    a: >-
      <a href="https://discord.gg/RdXtGzzHN" target="_blank" rel="noopener">サポートサーバー</a>の「#🐛不具合報告」「#💡要望・アイデア」か、<a href="/contact/">お問い合わせ</a>のメールからどうぞ。
- group: 毎日の使い方
  slug: daily
  items:
  - id: register
    q: 食材はどうやって登録する？
    a: >-
      いちばん手軽なのは、買い物のレシートを撮るか、ネットスーパー・通販の注文履歴の画面をスクショして、まかないシェフとのDMに送ることです。
      読み取った食材と期限の目安が一覧で届くので、いらないものを外して登録します。
      1つずつなら、DMの「➕ 食材を追加」ボタンか、<code>牛乳 明日</code>・<code>卵 1週間後、豆腐 3日後</code>のように文章で送っても登録できます。
  - id: photo-care
    q: 写真を送るとき、気をつけることは？
    a: >-
      名前・住所・電話番号・注文番号・カード番号・店名など、読み取りに要らない部分は隠してから送ってください（注文履歴の画面には住所や名前が写りやすいです）。
      隠さずに送った写真も、そのまま読み取りのAI（Anthropic社・米国）に送られます。まかないシェフは写真を保存しません（Anthropic社では、同社の規約により一定期間保持される場合があります）。
      1回に読むのは1枚目だけなので、何枚かあるときは1枚ずつ送ってください。
  - id: accuracy
    q: 登録される期限は正確？
    a: >-
      写真から付く期限は、買った日（注文履歴ならお届け日、無ければ注文日）から、食材ごとのだいたいの日数で付けた<strong>目安</strong>です。パッケージに書かれた期限を読み取っているわけではありません。
      未開封で、適切に保存した場合を前提にしています。表示の期限とはずれることがあるので、食べる前はパッケージの表示と食材の状態を確かめてください。
      正しい期限がわかっているときは、手で登録するか、あとから期限を変えてください。
  - id: change
    q: 登録した期限は変えられる？
    a: >-
      変えられます。まかないシェフとのDMに、<code>豆腐 3日後に変更</code>のように送ってください。
      <code>豆腐 5日後に変更、バナナ 明日に変更</code>のように、いくつかの食材をそれぞれ別の日付にまとめて変えることもできます。確認の画面が出てから変わります。
      「📋 リスト」の画面から、期限を変える食材を選ぶこともできます。
  - id: frozen
    q: 冷凍したものも登録できる？
    a: >-
      できます。<code>豚肉 冷凍</code>のように送るか、登録のときに「❄️ 冷凍で登録」を押すと、冷凍の目安の日付で登録されます。
      冷凍の日付は、新鮮なうちに家で冷凍した場合の一般的な目安で、その日まで安全という意味ではありません。パックに書かれた期限が変わるわけでもありません。食べる前に、においや見た目を確かめてください。
      冷凍の目安がまだ無い食材は、「❄️ 冷凍の目安をリクエスト」から運営者に知らせることができます。
  - id: quantity
    q: 個数も登録できる？
    a: >-
      できます。<code>卵 6個 1週間後</code>のように書くと個数つきで登録され、<code>卵 2個使った</code>と送ると残りが減ります。0になるとリストから外れます。
      個数を書かなければ、今までどおり個数なしで登録されます。
- group: お知らせが届いてから
  slug: notice
  items:
  - id: when
    q: お知らせはいつ届く？
    a: >-
      期限が今日か明日の食材があるときに、その日の朝8時（日本時間）にDMで届きます。期限が切れた食材は、期限の翌日の朝に一度お知らせします。対象の食材が無い日は届きません。
      8時を過ぎてから登録した食材は、次の朝のお知らせからになります（期限を今日にした食材は、次の朝が期限切れのお知らせになります）。
      Discordの障害やDMの設定によって、届かないこともあります。
  - id: used
    q: 使い切ったらどうする？
    a: >-
      お知らせの「○○ 使い切った」を押すか、<code>牛乳 使い切った</code>と送ると、確認のあとリストから外れます。
      次に買うとよさそうな食材も出るので、そのままボタンで登録できます。
  - id: expired
    q: 期限が切れた食材はどうなる？
    a: >-
      期限の翌日に一度お知らせが届き、そのあとはリストに「⚠️期限切れ」として残ります。自動では消えません。
      いらなくなったら、お知らせの「リストから外す」か「📋 リスト」から外してください。
      期限が切れたものを食べられるかどうかは、パッケージの表示と食材の状態を見て判断してください。
  - id: recipe
    q: レシピはどうやって出してもらう？
    a: >-
      お知らせの「使い切るレシピを提案してもらう」を押すと、期限が近い食材を使うレシピをAIが出します。
      お知らせを待たずに見たいときは、DMに<code>レシピ</code>と送るとボタンが出ます。
      AIのレシピは誤りを含むことがあるので、アレルギーや加熱の具合はご自身で確かめてください。
  - id: fridge
    q: お知らせを待たずに、冷蔵庫の中身からレシピを見られる？
    a: >-
      見られます。冷蔵庫の中を撮ってDMに送ると、読み取った食材の一覧が出ます。違うものは外し、足りないものは足してから「この食材でレシピを見る」を押すと、AIがレシピを出します。冷蔵庫の写真では、食材は登録されません。
      写真を送ると写真の読み取りを1回、「この食材でレシピを見る」を押すとAIの提案を1回使います。AIの回数を使い切った日は、ボタンが押せなくなります。レシートなのに冷蔵庫の写真として扱われたときなどは、ボタンで切り替えられます（どちらの回数も使いません）。
      読み取りやレシピは誤りを含むことがあるので、食材とレシピはご自身で確かめてください。
- group: お金・データ・やめ方
  slug: money
  items:
  - id: premium
    q: プレミアムプランはどんなもの？
    a: >-
      月額480円（税込）で、AIの提案と写真の読み取りを使える回数が増えます（上限あり）。
      申し込みは<code>/upgrade</code>、解約や支払い方法の変更は<code>/manage</code>からいつでもできます。
      毎月自動で更新・決済されます。解約すると自動更新が止まり、次の請求日からは課金されません。すでに支払った月の料金は返金されません（日割りの返金もありません）。
      くわしくは<a href="/legal/#terms">利用規約</a>と<a href="/legal/#tokushoho">特定商取引法に基づく表記</a>をご覧ください。
  - id: data
    q: どんな情報を保存する？外部に送られる？
    a: >-
      保存するのは、登録した食材名と期限（書いた場合は個数、冷凍かどうか）、DiscordユーザーID、プラン、利用回数、レシピへの評価などです。プレミアムの人は、Stripeの顧客IDも保存します（カード番号は保存しません）。
      DMに送った文章そのものは保存しません。写真も、まかないシェフのデータベースには保存しません。ただし、冷蔵庫の写真で読み取った食材名と直した内容は、読み取りの改善のため、誰の記録か分からない形で30日間記録します。
      写真の読み取り・AIのレシピ・買い足しの提案にはAnthropic社（米国）を使っています。写真と食材名は送りますが、DiscordユーザーIDは送りません。決済にはStripe社、サーバーにはRailway社のサービスを使い、運営者が利用状況のログを分析するときにはGoogle社のサービスを使うことがあります。DMのやり取りの履歴はDiscordに残ります。
      くわしくは<a href="/legal/#privacy">プライバシーポリシー</a>をご覧ください。
  - id: quit
    q: やめるには？データは消せる？
    a: >-
      まかないシェフを外しただけでは、登録は消えず、プレミアムも解約されません（課金が続きます）。
      外す前に、プレミアムの人は<code>/manage</code>で解約し、いらない登録を「📋 リスト」から外してください。
      そのあと、Discordの「設定 → 認証済みアプリ」から外します（サーバーに入れた場合は、サーバー設定の「連携サービス」から）。自分のアカウントから外すとお知らせは止まりますが、サーバーから外しただけでは止まらないことがあります。
      DiscordユーザーIDや利用回数など、登録以外の情報も消したいときは、外す前でも後でも<a href="mailto:info@opera-ai.jp">info@opera-ai.jp</a>へメールで頼めます（ご本人の確認があります）。くわしくは<a href="/legal/#privacy">プライバシーポリシー</a>の6と7をご覧ください。
